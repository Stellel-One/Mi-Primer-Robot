<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a114f"/>
      <stop offset="50%" stop-color="#18092e"/>
      <stop offset="100%" stop-color="#0f041d"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Placa Base de Expansión Breakout -->
  <g filter="url(#shieldShadow)">
    <rect x="30" y="30" width="180" height="120" rx="10" fill="url(#shieldPcb)" stroke="#3b1a6c" stroke-width="2"/>
    <!-- Orificios de fijación con tornillos y arandelas -->
    <circle cx="42" cy="42" r="4.5" fill="#110524" stroke="#cfc0ab" stroke-width="1.5"/>
    <circle cx="198" cy="42" r="4.5" fill="#110524" stroke="#cfc0ab" stroke-width="1.5"/>
    <circle cx="42" cy="138" r="4.5" fill="#110524" stroke="#cfc0ab" stroke-width="1.5"/>
    <circle cx="198" cy="138" r="4.5" fill="#110524" stroke="#cfc0ab" stroke-width="1.5"/>
  </g>

  <!-- Zócalo Slot para Micro:bit (Edge Socket Negro) -->
  <rect x="45" y="48" width="150" height="24" rx="4" fill="#0d031c" stroke="#cfc0ab" stroke-width="1.5"/>
  <rect x="52" y="55" width="136" height="10" fill="#18092e"/>
  <!-- Contactos internos dorados -->
  <line x1="56" y1="56" x2="56" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="64" y1="56" x2="64" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="72" y1="56" x2="72" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="80" y1="56" x2="80" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="88" y1="56" x2="88" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="96" y1="56" x2="96" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="104" y1="56" x2="104" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="112" y1="56" x2="112" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="120" y1="56" x2="120" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="128" y1="56" x2="128" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="136" y1="56" x2="136" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="144" y1="56" x2="144" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="152" y1="56" x2="152" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="160" y1="56" x2="160" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="168" y1="56" x2="168" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="176" y1="56" x2="176" y2="64" stroke="#fde047" stroke-width="1.5"/>
  <line x1="184" y1="56" x2="184" y2="64" stroke="#fde047" stroke-width="1.5"/>

  <!-- Tira de Pines GPIO (Fila Señal Amarillo, Fila VCC Rojo, Fila GND Negro) -->
  <!-- Fila Señal (Amarillo) -->
  <g fill="#fde047">
    <circle cx="56" cy="90" r="3"/><circle cx="68" cy="90" r="3"/><circle cx="80" cy="90" r="3"/><circle cx="92" cy="90" r="3"/><circle cx="104" cy="90" r="3"/><circle cx="116" cy="90" r="3"/><circle cx="128" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="152" cy="90" r="3"/><circle cx="164" cy="90" r="3"/><circle cx="176" cy="90" r="3"/><circle cx="184" cy="90" r="3"/>
  </g>
  <text x="44" y="93" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#fde047" font-weight="700">S</text>

  <!-- Fila VCC (Rojo) -->
  <g fill="#ef4444">
    <circle cx="56" cy="104" r="3"/><circle cx="68" cy="104" r="3"/><circle cx="80" cy="104" r="3"/><circle cx="92" cy="104" r="3"/><circle cx="104" cy="104" r="3"/><circle cx="116" cy="104" r="3"/><circle cx="128" cy="104" r="3"/><circle cx="140" cy="104" r="3"/><circle cx="152" cy="104" r="3"/><circle cx="164" cy="104" r="3"/><circle cx="176" cy="104" r="3"/><circle cx="184" cy="104" r="3"/>
  </g>
  <text x="44" y="107" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#ef4444" font-weight="700">V</text>

  <!-- Fila GND (Negro / Azul) -->
  <g fill="#2dd4bf">
    <circle cx="56" cy="118" r="3"/><circle cx="68" cy="118" r="3"/><circle cx="80" cy="118" r="3"/><circle cx="92" cy="118" r="3"/><circle cx="104" cy="118" r="3"/><circle cx="116" cy="118" r="3"/><circle cx="128" cy="118" r="3"/><circle cx="140" cy="118" r="3"/><circle cx="152" cy="118" r="3"/><circle cx="164" cy="118" r="3"/><circle cx="176" cy="118" r="3"/><circle cx="184" cy="118" r="3"/>
  </g>
  <text x="44" y="121" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#2dd4bf" font-weight="700">G</text>

  <!-- Rótulo técnico -->
  <text x="120" y="140" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#2dd4bf" font-weight="700" text-anchor="middle">SHIELD EXPANSOR MICRO:BIT</text>
  <text x="120" y="166" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#cfc0ab" text-anchor="middle" font-weight="600">PINES G-V-S PARA SENSORES Y ACTUADORES</text>
</svg>