<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="l298Pcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="heatsinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="terminalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="l298Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Placa PCB Roja del L298N -->
  <g filter="url(#l298Shadow)">
    <rect x="42" y="24" width="156" height="136" rx="8" fill="url(#l298Pcb)" stroke="#fca5a5" stroke-width="1.2"/>
    <circle cx="52" cy="34" r="3.5" fill="#e2e8f0"/>
    <circle cx="188" cy="34" r="3.5" fill="#e2e8f0"/>
    <circle cx="52" cy="150" r="3.5" fill="#e2e8f0"/>
    <circle cx="188" cy="150" r="3.5" fill="#e2e8f0"/>
  </g>

  <!-- Gran Disipador de Aluminio Negro con Aletas -->
  <rect x="75" y="32" width="90" height="48" rx="4" fill="url(#heatsinkGrad)" stroke="#64748b" stroke-width="1.2"/>
  <!-- Aletas del disipador -->
  <line x1="85" y1="32" x2="85" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="95" y1="32" x2="95" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="105" y1="32" x2="105" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="115" y1="32" x2="115" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="125" y1="32" x2="125" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="135" y1="32" x2="135" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="145" y1="32" x2="145" y2="70" stroke="#475569" stroke-width="2"/>
  <line x1="155" y1="32" x2="155" y2="70" stroke="#475569" stroke-width="2"/>
  <!-- Tornillo de anclaje del chip L298 -->
  <circle cx="120" cy="56" r="4" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
  <line x1="117" y1="56" x2="123" y2="56" stroke="#334155" stroke-width="1.5"/>

  <!-- Bornera Azul de Alimentación (VCC, GND, +5V) -->
  <rect x="92" y="122" width="56" height="30" rx="3" fill="url(#terminalBlue)" stroke="#1e3a8a" stroke-width="1.2"/>
  <circle cx="102" cy="137" r="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="120" cy="137" r="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="138" cy="137" r="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bornera Lateral Izquierda: Motor A (OUT1, OUT2) -->
  <rect x="48" y="76" width="24" height="42" rx="3" fill="url(#terminalBlue)" stroke="#1e3a8a" stroke-width="1.2"/>
  <circle cx="60" cy="88" r="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="60" cy="106" r="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bornera Lateral Derecha: Motor B (OUT3, OUT4) -->
  <rect x="168" y="76" width="24" height="42" rx="3" fill="url(#terminalBlue)" stroke="#1e3a8a" stroke-width="1.2"/>
  <circle cx="180" cy="88" r="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="180" cy="106" r="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Condensadores electrolíticos de filtrado -->
  <circle cx="95" cy="98" r="11" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="88" y1="98" x2="102" y2="98" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="145" cy="98" r="11" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="138" y1="98" x2="152" y2="98" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Pines Header de Señales Lógicas (ENA, IN1..IN4, ENB) -->
  <rect x="96" y="112" width="48" height="6" fill="#1e293b"/>
  <line x1="100" y1="110" x2="100" y2="116" stroke="#fde047" stroke-width="1.5"/>
  <line x1="108" y1="110" x2="108" y2="116" stroke="#fde047" stroke-width="1.5"/>
  <line x1="116" y1="110" x2="116" y2="116" stroke="#fde047" stroke-width="1.5"/>
  <line x1="124" y1="110" x2="124" y2="116" stroke="#fde047" stroke-width="1.5"/>
  <line x1="132" y1="110" x2="132" y2="116" stroke="#fde047" stroke-width="1.5"/>
  <line x1="140" y1="110" x2="140" y2="116" stroke="#fde047" stroke-width="1.5"/>

  <!-- Rótulo del componente -->
  <text x="120" y="172" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#2dd4bf" font-weight="700" text-anchor="middle">PUENTE H DUAL L298N (2A)</text>
</svg>