<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pista con línea negra de contraste -->
  <rect x="20" y="240" width="360" height="60" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <path d="M 20 270 Q 150 250 200 270 T 380 270" stroke="#000000" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M 20 270 Q 150 250 200 270 T 380 270" stroke="#00f2fe" stroke-width="2" fill="none" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Ruedas laterales -->
  <rect x="75" y="100" width="30" height="90" rx="8" fill="url(#wheelGrad)" stroke="#38bdf8" stroke-width="2"/>
  <line x1="75" y1="120" x2="105" y2="120" stroke="#64748b" stroke-width="2"/>
  <line x1="75" y1="145" x2="105" y2="145" stroke="#64748b" stroke-width="2"/>
  <line x1="75" y1="170" x2="105" y2="170" stroke="#64748b" stroke-width="2"/>

  <rect x="295" y="100" width="30" height="90" rx="8" fill="url(#wheelGrad)" stroke="#38bdf8" stroke-width="2"/>
  <line x1="295" y1="120" x2="325" y2="120" stroke="#64748b" stroke-width="2"/>
  <line x1="295" y1="145" x2="325" y2="145" stroke="#64748b" stroke-width="2"/>
  <line x1="295" y1="170" x2="325" y2="170" stroke="#64748b" stroke-width="2"/>

  <!-- Chasis Principal (Acrílico tecnológico) -->
  <rect x="100" y="80" width="200" height="150" rx="24" fill="url(#chassisGrad)" stroke="#00f2fe" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Rueda Loca / Caster frontal -->
  <circle cx="200" cy="95" r="14" fill="#94a3b8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="200" cy="95" r="6" fill="#38bdf8"/>

  <!-- Sensores Frontales con emisión Infrarroja -->
  <rect x="150" y="55" width="22" height="30" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="161" cy="62" r="4" fill="#ef4444"/>
  <circle cx="161" cy="76" r="4" fill="#1e293b"/>

  <rect x="228" y="55" width="22" height="30" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="239" cy="62" r="4" fill="#ef4444"/>
  <circle cx="239" cy="76" r="4" fill="#1e293b"/>

  <!-- Haces IR hacia el suelo -->
  <polygon points="156,70 166,70 180,240 142,240" fill="url(#chassisGrad)" opacity="0.35" />
  <line x1="161" y1="78" x2="161" y2="240" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="234,70 244,70 258,240 220,240" fill="url(#chassisGrad)" opacity="0.35" />
  <line x1="239" y1="78" x2="239" y2="240" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Placa de Circuito Analógica (Protoboard / PCB) -->
  <rect x="125" y="125" width="150" height="85" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <!-- Chip Comparador LM393 -->
  <rect x="175" y="145" width="50" height="30" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="182" y="165" font-family="monospace" font-size="9" fill="#38bdf8" font-weight="bold">LM393</text>
  <!-- Patitas del chip -->
  <line x1="182" y1="140" x2="182" y2="145" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="192" y1="140" x2="192" y2="145" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="208" y1="140" x2="208" y2="145" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="218" y1="140" x2="218" y2="145" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Indicador LED Estado -->
  <circle cx="140" cy="145" r="4" fill="#10b981" filter="url(#neonGlow)"/>
  <circle cx="260" cy="145" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Logo de Robot Autónomo -->
  <text x="200" y="200" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">CIRCUITO ANALÓGICO DISCRETO</text>
</svg>

