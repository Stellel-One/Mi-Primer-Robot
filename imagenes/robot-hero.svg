<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="100%" height="100%">
  <defs>
    <!-- Background Track Gradients -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140628"/>
      <stop offset="50%" stop-color="#1a0933"/>
      <stop offset="100%" stop-color="#100422"/>
    </linearGradient>

    <!-- Chassis Royal Purple Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1a6c"/>
      <stop offset="45%" stop-color="#271147"/>
      <stop offset="100%" stop-color="#18092e"/>
    </linearGradient>

    <!-- PCB Aquamarine Gradient -->
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>

    <!-- Wheel Rim & Tire Gradients -->
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#110524"/>
      <stop offset="30%" stop-color="#2d1354"/>
      <stop offset="70%" stop-color="#271147"/>
      <stop offset="100%" stop-color="#0d031c"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- IR Beam Gradients -->
    <linearGradient id="beamLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="beamRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="aquaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="chassisShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#090117" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Pista Tecnológica Inferior -->
  <rect x="20" y="240" width="380" height="75" rx="16" fill="url(#trackGrad)" stroke="#3b1a6c" stroke-width="2"/>
  
  <!-- Cuadrícula / Guías de Pista -->
  <line x1="20" y1="265" x2="400" y2="265" stroke="#271147" stroke-width="1" stroke-dasharray="8,8"/>
  <line x1="20" y1="290" x2="400" y2="290" stroke="#271147" stroke-width="1" stroke-dasharray="8,8"/>

  <!-- Línea Negra de Seguimiento Óptico (Cinta aislante mate) -->
  <path d="M 20 278 Q 150 255 210 278 T 400 278" stroke="#05010a" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Línea guía de centrado de contraste -->
  <path d="M 20 278 Q 150 255 210 278 T 400 278" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-dasharray="6,8" opacity="0.45"/>

  <!-- Sombra del Robot proyectada -->
  <ellipse cx="210" cy="225" rx="135" ry="32" fill="#06010e" opacity="0.6"/>

  <!-- Ruedas de Tracción con Motorreductor (Izquierda y Derecha) -->
  <!-- Rueda Izquierda -->
  <g id="leftWheel">
    <rect x="68" y="98" width="34" height="96" rx="9" fill="url(#tireGrad)" stroke="#3b1a6c" stroke-width="2"/>
    <!-- Relieve de la cubierta de goma -->
    <line x1="68" y1="116" x2="102" y2="116" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="68" y1="134" x2="102" y2="134" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="68" y1="152" x2="102" y2="152" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="68" y1="170" x2="102" y2="170" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <!-- Llanta central decorativa -->
    <rect x="79" y="125" width="12" height="42" rx="4" fill="url(#rimGrad)"/>
  </g>

  <!-- Rueda Derecha -->
  <g id="rightWheel">
    <rect x="318" y="98" width="34" height="96" rx="9" fill="url(#tireGrad)" stroke="#3b1a6c" stroke-width="2"/>
    <!-- Relieve de la cubierta de goma -->
    <line x1="318" y1="116" x2="352" y2="116" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="318" y1="134" x2="352" y2="134" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="318" y1="152" x2="352" y2="152" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <line x1="318" y1="170" x2="352" y2="170" stroke="#2dd4bf" stroke-width="1.5" opacity="0.6"/>
    <!-- Llanta central decorativa -->
    <rect x="329" y="125" width="12" height="42" rx="4" fill="url(#rimGrad)"/>
  </g>

  <!-- Chasis Principal Acrílico Morado con Bisel de Neón Aguamarina -->
  <g filter="url(#chassisShadow)">
    <rect x="96" y="75" width="228" height="155" rx="26" fill="url(#chassisGrad)" stroke="#2dd4bf" stroke-width="2.5" filter="url(#aquaGlow)"/>
    <!-- Bisel interior con brillo -->
    <rect x="102" y="81" width="216" height="143" rx="20" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Rueda Loca Frontal (Caster esférica) -->
  <circle cx="210" cy="92" r="15" fill="#271147" stroke="#e7dccb" stroke-width="2.5"/>
  <circle cx="210" cy="92" r="7" fill="#2dd4bf"/>

  <!-- Módulos de Sensores Infrarrojos TCRT5000 (Frontales) -->
  <!-- Sensor Izquierdo -->
  <g id="sensorLeft">
    <rect x="150" y="48" width="26" height="34" rx="5" fill="#110524" stroke="#2dd4bf" stroke-width="1.8"/>
    <!-- Emisor IR -->
    <circle cx="163" cy="58" r="5" fill="#3b1a6c" stroke="#2dd4bf" stroke-width="1.2"/>
    <!-- Fototransistor Receptor -->
    <circle cx="163" cy="72" r="5" fill="#042f2e" stroke="#5eead4" stroke-width="1.2"/>
  </g>

  <!-- Sensor Derecho -->
  <g id="sensorRight">
    <rect x="244" y="48" width="26" height="34" rx="5" fill="#110524" stroke="#2dd4bf" stroke-width="1.8"/>
    <!-- Emisor IR -->
    <circle cx="257" cy="58" r="5" fill="#3b1a6c" stroke="#2dd4bf" stroke-width="1.2"/>
    <!-- Fototransistor Receptor -->
    <circle cx="257" cy="72" r="5" fill="#042f2e" stroke="#5eead4" stroke-width="1.2"/>
  </g>

  <!-- Haces de Detección Óptica Infrarroja hacia el suelo -->
  <polygon points="154,78 172,78 190,265 136,265" fill="url(#beamLeft)"/>
  <line x1="163" y1="82" x2="163" y2="265" stroke="#2dd4bf" stroke-width="1.8" stroke-dasharray="4,4"/>

  <polygon points="248,78 266,78 284,265 230,265" fill="url(#beamRight)"/>
  <line x1="257" y1="82" x2="257" y2="265" stroke="#5eead4" stroke-width="1.8" stroke-dasharray="4,4"/>

  <!-- Placa de Control Analógica Central (PCB Verde Aguamarina / Teal) -->
  <rect x="122" y="122" width="176" height="92" rx="12" fill="url(#pcbGrad)" stroke="#2dd4bf" stroke-width="1.8"/>

  <!-- Pistas de Circuito Impreso (Cobre / Aguamarina brillante) -->
  <path d="M 134 135 L 165 135 L 175 148" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.75"/>
  <path d="M 286 135 L 255 135 L 245 148" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.75"/>
  <path d="M 140 195 L 165 195 L 180 180" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.75"/>
  <path d="M 280 195 L 255 195 L 240 180" stroke="#5eead4" stroke-width="1.5" fill="none" opacity="0.75"/>

  <!-- Chip Comparador LM393 Dual (DIP-8) -->
  <rect x="180" y="145" width="60" height="34" rx="4" fill="#110524" stroke="#99f6e4" stroke-width="1.5"/>
  <!-- Muesca de polaridad pin 1 -->
  <path d="M 180 158 A 4 4 0 0 1 180 166" fill="#271147" stroke="#99f6e4" stroke-width="1.2"/>
  <text x="188" y="167" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#2dd4bf" font-weight="700" letter-spacing="1">LM393</text>

  <!-- Terminales metálicas del chip (4 arriba y 4 abajo) -->
  <line x1="188" y1="139" x2="188" y2="145" stroke="#e7dccb" stroke-width="2.5"/>
  <line x1="198" y1="139" x2="198" y2="145" stroke="#e7dccb" stroke-width="2.5"/>
  <line x1="212" y1="139" x2="212" y2="145" stroke="#e7dccb" stroke-width="2.5"/>
  <line x1="222" y1="139" x2="222" y2="145" stroke="#e7dccb" stroke-width="2.5"/>

  <line x1="188" y1="179" x2="188" y2="185" stroke="#e7dccb" stroke-width="2.5"/>
  <line x1="198" y1="179" x2="198" y2="185" stroke="#e7dccb" stroke-width="2.5"/>
  <line x1="212" y1="179" x2="212" y2="185" stroke="#e7dccb" stroke-width="2.5"/>
  <line x1="222" y1="179" x2="222" y2="185" stroke="#e7dccb" stroke-width="2.5"/>

  <!-- Transistores BJT NPN (Corte y Saturación para Motores) -->
  <circle cx="145" cy="162" r="7" fill="#18092e" stroke="#2dd4bf" stroke-width="1.5"/>
  <circle cx="275" cy="162" r="7" fill="#18092e" stroke="#2dd4bf" stroke-width="1.5"/>

  <!-- Potenciómetros Trimpot Calibradores -->
  <rect x="135" y="132" width="16" height="16" rx="3" fill="#3b1a6c" stroke="#5eead4" stroke-width="1.2"/>
  <circle cx="143" cy="140" r="4" fill="#2dd4bf"/>
  <rect x="269" y="132" width="16" height="16" rx="3" fill="#3b1a6c" stroke="#5eead4" stroke-width="1.2"/>
  <circle cx="277" cy="140" r="4" fill="#2dd4bf"/>

  <!-- Indicadores LED de Estado Lumínico -->
  <circle cx="160" cy="200" r="4.5" fill="#2dd4bf" filter="url(#aquaGlow)"/>
  <circle cx="260" cy="200" r="4.5" fill="#5eead4" filter="url(#aquaGlow)"/>

  <!-- Rótulo de Arquitectura Electrónica -->
  <text x="210" y="204" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#e7dccb" text-anchor="middle" font-weight="700" letter-spacing="1.2">CIRCUITO ANALÓGICO DISCRETO</text>
</svg>