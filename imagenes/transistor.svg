<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="to92Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1354"/>
      <stop offset="60%" stop-color="#18092e"/>
      <stop offset="100%" stop-color="#110524"/>
    </linearGradient>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfc0ab"/>
      <stop offset="100%" stop-color="#766485"/>
    </linearGradient>
    <filter id="transShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Patillas / Terminales Metálicas E, B, C -->
  <line x1="88" y1="80" x2="88" y2="150" stroke="url(#leadGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="120" y1="80" x2="120" y2="155" stroke="url(#leadGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="152" y1="80" x2="152" y2="150" stroke="url(#leadGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Etiquetas de los pines (Emisor, Base, Colector) -->
  <circle cx="88" cy="164" r="8" fill="#18092e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="88" y="167.5" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2dd4bf" font-weight="700" text-anchor="middle">E</text>

  <circle cx="120" cy="164" r="8" fill="#18092e" stroke="#5eead4" stroke-width="1.5"/>
  <text x="120" y="167.5" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5eead4" font-weight="700" text-anchor="middle">B</text>

  <circle cx="152" cy="164" r="8" fill="#18092e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="152" y="167.5" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2dd4bf" font-weight="700" text-anchor="middle">C</text>

  <!-- Encapsulado TO-92 (Vista Frontal y Cúpula) -->
  <g filter="url(#transShadow)">
    <path d="M 68 80 A 52 52 0 0 1 172 80 Z" fill="url(#to92Grad)" stroke="#3b1a6c" stroke-width="2"/>
    <rect x="68" y="74" width="104" height="12" rx="3" fill="#18092e" stroke="#3b1a6c" stroke-width="1.5"/>
  </g>

  <!-- Rótulo del componente -->
  <text x="120" y="58" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="middle" letter-spacing="1">2N2222A</text>
  <text x="120" y="70" font-family="'DM Sans', sans-serif" font-size="7" fill="#cfc0ab" text-anchor="middle" font-weight="600">NPN BJT SWITCH</text>
</svg>