<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="resBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfc0ab"/>
      <stop offset="100%" stop-color="#766485"/>
    </linearGradient>
    <filter id="resShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0c0418" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Resistencia 1: 220 Ohmios (Rojo - Rojo - Marrón - Dorado) -->
  <g id="res220" filter="url(#resShadow)">
    <line x1="20" y1="45" x2="220" y2="45" stroke="url(#wireGrad)" stroke-width="3" stroke-linecap="round"/>
    <rect x="75" y="30" width="90" height="30" rx="8" fill="url(#resBodyGrad)" stroke="#78350f" stroke-width="1.2"/>
    <!-- Bandas de color -->
    <rect x="92" y="30" width="8" height="30" fill="#dc2626"/>
    <rect x="108" y="30" width="8" height="30" fill="#dc2626"/>
    <rect x="124" y="30" width="8" height="30" fill="#78350f"/>
    <rect x="144" y="30" width="8" height="30" fill="#ca8a04"/>
    <text x="120" y="73" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#2dd4bf" font-weight="700" text-anchor="middle">220 Ω (LEDs)</text>
  </g>

  <!-- Resistencia 2: 1 kOhmio (Marrón - Negro - Rojo - Dorado) -->
  <g id="res1k" filter="url(#resShadow)">
    <line x1="20" y1="100" x2="220" y2="100" stroke="url(#wireGrad)" stroke-width="3" stroke-linecap="round"/>
    <rect x="75" y="85" width="90" height="30" rx="8" fill="url(#resBodyGrad)" stroke="#78350f" stroke-width="1.2"/>
    <!-- Bandas de color -->
    <rect x="92" y="85" width="8" height="30" fill="#78350f"/>
    <rect x="108" y="85" width="8" height="30" fill="#110524"/>
    <rect x="124" y="85" width="8" height="30" fill="#dc2626"/>
    <rect x="144" y="85" width="8" height="30" fill="#ca8a04"/>
    <text x="120" y="128" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#5eead4" font-weight="700" text-anchor="middle">1 kΩ (Transistores)</text>
  </g>

  <!-- Resistencia 3 / Rótulo de tolerancias -->
  <text x="120" y="155" font-family="'DM Sans', sans-serif" font-size="8" fill="#cfc0ab" font-weight="600" text-anchor="middle">PELÍCULA DE CARBÓN 1/4W · TOLERANCIA ±5%</text>
</svg>