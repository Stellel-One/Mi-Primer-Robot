<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="icBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1354"/>
      <stop offset="50%" stop-color="#18092e"/>
      <stop offset="100%" stop-color="#0f041d"/>
    </linearGradient>
    <linearGradient id="pinMetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfc0ab"/>
      <stop offset="100%" stop-color="#766485"/>
    </linearGradient>
    <filter id="icShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Pines Superiores (Pines 8, 7, 6, 5) -->
  <g id="topPins">
    <rect x="62" y="24" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
    <rect x="94" y="24" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
    <rect x="134" y="24" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
    <rect x="166" y="24" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
  </g>

  <!-- Pines Inferiores (Pines 1, 2, 3, 4) -->
  <g id="bottomPins">
    <rect x="62" y="132" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
    <rect x="94" y="132" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
    <rect x="134" y="132" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
    <rect x="166" y="132" width="12" height="24" rx="2" fill="url(#pinMetalGrad)" stroke="#18092e" stroke-width="1"/>
  </g>

  <!-- Cuerpo Encapsulado DIP-8 en Morado Oscuro Premium -->
  <g filter="url(#icShadow)">
    <rect x="44" y="42" width="152" height="96" rx="10" fill="url(#icBodyGrad)" stroke="#3b1a6c" stroke-width="2"/>
    <!-- Muesca semicircular Pin 1 -->
    <path d="M 44 82 A 8 8 0 0 1 44 98" fill="#18092e" stroke="#3b1a6c" stroke-width="1.8"/>
    <!-- Punto de referencia Pin 1 -->
    <circle cx="62" cy="112" r="4" fill="#2dd4bf"/>
  </g>

  <!-- Grabado Láser del Modelo LM393 -->
  <text x="122" y="86" font-family="'IBM Plex Mono', monospace" font-size="19" fill="#2dd4bf" font-weight="700" text-anchor="middle" letter-spacing="2">LM393</text>
  <text x="122" y="104" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#cfc0ab" text-anchor="middle" font-weight="600" letter-spacing="1.2">DUAL COMPARATOR · DIP-8</text>

  <!-- Línea decorativa biselada en el chip -->
  <line x1="58" y1="52" x2="182" y2="52" stroke="#5eead4" stroke-width="1" opacity="0.3"/>
</svg>