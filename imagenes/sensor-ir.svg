<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="irPcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a114f"/>
      <stop offset="100%" stop-color="#140727"/>
    </linearGradient>
    <linearGradient id="trimpotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="60%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#110524"/>
    </linearGradient>
    <filter id="irGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2dd4bf" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sombra del módulo -->
  <rect x="36" y="22" width="168" height="136" rx="14" fill="#0c0418" opacity="0.4"/>

  <!-- Placa PCB Morado Profundo -->
  <rect x="32" y="18" width="176" height="138" rx="12" fill="url(#irPcbGrad)" stroke="#3b1a6c" stroke-width="2"/>
  <rect x="36" y="22" width="168" height="130" rx="8" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>

  <!-- Pistas serigrafiadas -->
  <path d="M 52 40 L 80 40 L 95 65" stroke="#2dd4bf" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 188 40 L 160 40 L 145 65" stroke="#2dd4bf" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- Sensor Óptico TCRT5000 (Carcasa doble frontal) -->
  <rect x="74" y="28" width="92" height="42" rx="7" fill="#110524" stroke="#2dd4bf" stroke-width="1.6" filter="url(#irGlow)"/>

  <!-- Diodo Emisor Infrarrojo (LED oscuro / transparente azulado) -->
  <rect x="84" y="34" width="28" height="30" rx="4" fill="#18092e" stroke="#5eead4" stroke-width="1.2"/>
  <circle cx="98" cy="49" r="9" fill="url(#lensGrad)"/>
  <circle cx="95" cy="46" r="3" fill="#ffffff" opacity="0.8"/>
  <text x="98" y="76" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#2dd4bf" text-anchor="middle" font-weight="700">TX (IR)</text>

  <!-- Fototransistor Receptor (Carcasa negra de filtro luz visible) -->
  <rect x="128" y="34" width="28" height="30" rx="4" fill="#090214" stroke="#3b1a6c" stroke-width="1.2"/>
  <circle cx="142" cy="49" r="9" fill="#0a0316" stroke="#2dd4bf" stroke-width="1"/>
  <circle cx="140" cy="47" r="2.5" fill="#2dd4bf" opacity="0.6"/>
  <text x="142" y="76" font-family="'IBM Plex Mono', monospace" font-size="7" fill="#99f6e4" text-anchor="middle" font-weight="700">RX (FOTO)</text>

  <!-- Potenciómetro Trimpot de Ajuste de Sensibilidad -->
  <rect x="96" y="86" width="48" height="30" rx="5" fill="url(#trimpotGrad)" stroke="#2dd4bf" stroke-width="1.4"/>
  <circle cx="120" cy="101" r="9" fill="#18092e" stroke="#e7dccb" stroke-width="1.5"/>
  <line x1="114" y1="101" x2="126" y2="101" stroke="#e7dccb" stroke-width="2" stroke-linecap="round"/>
  <text x="120" y="126" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#e7dccb" text-anchor="middle" font-weight="700">CALIBRADOR UMBRAL</text>

  <!-- Pines Header Macho (VCC, GND, D0, A0) -->
  <g id="pins">
    <rect x="54" y="138" width="10" height="14" rx="2" fill="#e7dccb" stroke="#3b1a6c" stroke-width="1"/>
    <rect x="88" y="138" width="10" height="14" rx="2" fill="#e7dccb" stroke="#3b1a6c" stroke-width="1"/>
    <rect x="142" y="138" width="10" height="14" rx="2" fill="#e7dccb" stroke="#3b1a6c" stroke-width="1"/>
    <rect x="176" y="138" width="10" height="14" rx="2" fill="#e7dccb" stroke="#3b1a6c" stroke-width="1"/>
  </g>

  <!-- LEDs indicadores de alimentación y detección -->
  <circle cx="58" cy="98" r="4" fill="#2dd4bf"/>
  <circle cx="58" cy="98" r="7" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.4"/>
  <text x="58" y="112" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#cfc0ab" text-anchor="middle">PWR</text>

  <circle cx="182" cy="98" r="4" fill="#5eead4"/>
  <circle cx="182" cy="98" r="7" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.4"/>
  <text x="182" y="112" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#cfc0ab" text-anchor="middle">OUT</text>
</svg>