<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cfc0ab"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0c0418" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Separador Hexagonal M3 de Latón (Centro) -->
  <g id="standoff" filter="url(#hardShadow)">
    <!-- Espárrago roscado superior macho -->
    <rect x="88" y="24" width="14" height="20" rx="1" fill="url(#brassGrad)" stroke="#78350f" stroke-width="1"/>
    <line x1="88" y1="28" x2="102" y2="28" stroke="#78350f" stroke-width="1"/>
    <line x1="88" y1="32" x2="102" y2="32" stroke="#78350f" stroke-width="1"/>
    <line x1="88" y1="36" x2="102" y2="36" stroke="#78350f" stroke-width="1"/>
    <line x1="88" y1="40" x2="102" y2="40" stroke="#78350f" stroke-width="1"/>

    <!-- Cuerpo hexagonal hembra -->
    <rect x="82" y="44" width="26" height="74" rx="2" fill="url(#brassGrad)" stroke="#78350f" stroke-width="1.5"/>
    <!-- Caras del hexágono con reflejo de luz -->
    <line x1="91" y1="44" x2="91" y2="118" stroke="#fef9c3" stroke-width="1.5"/>
    <line x1="99" y1="44" x2="99" y2="118" stroke="#a16207" stroke-width="1.5"/>
    <text x="95" y="132" font-family="'IBM Plex Mono', monospace" font-size="7.5" fill="#2dd4bf" font-weight="700" text-anchor="middle">H-M 20mm</text>
  </g>

  <!-- Tornillo M3 de Acero Inoxidable (Izquierda) -->
  <g id="screw" filter="url(#hardShadow)">
    <!-- Cabeza pan-head con ranura Phillips (+) -->
    <path d="M 40 44 C 40 34 64 34 64 44 Z" fill="url(#steelGrad)" stroke="#334155" stroke-width="1.2"/>
    <line x1="52" y1="36" x2="52" y2="42" stroke="#18092e" stroke-width="2"/>
    <line x1="48" y1="39" x2="56" y2="39" stroke="#18092e" stroke-width="2"/>

    <!-- Vástago Roscado -->
    <rect x="46" y="44" width="12" height="66" rx="1" fill="url(#steelGrad)" stroke="#334155" stroke-width="1"/>
    <line x1="46" y1="52" x2="58" y2="52" stroke="#475569" stroke-width="1.2"/>
    <line x1="46" y1="60" x2="58" y2="60" stroke="#475569" stroke-width="1.2"/>
    <line x1="46" y1="68" x2="58" y2="68" stroke="#475569" stroke-width="1.2"/>
    <line x1="46" y1="76" x2="58" y2="76" stroke="#475569" stroke-width="1.2"/>
    <line x1="46" y1="84" x2="58" y2="84" stroke="#475569" stroke-width="1.2"/>
    <line x1="46" y1="92" x2="58" y2="92" stroke="#475569" stroke-width="1.2"/>
    <line x1="46" y1="100" x2="58" y2="100" stroke="#475569" stroke-width="1.2"/>
    <text x="52" y="124" font-family="'IBM Plex Mono', monospace" font-size="7.5" fill="#cfc0ab" font-weight="700" text-anchor="middle">M3 x 10</text>
  </g>

  <!-- Tuerca Hexagonal M3 y Arandela (Derecha) -->
  <g id="nutWasher" filter="url(#hardShadow)">
    <!-- Arandela plana -->
    <ellipse cx="165" cy="50" rx="22" ry="10" fill="url(#steelGrad)" stroke="#334155" stroke-width="1.2"/>
    <ellipse cx="165" cy="50" rx="9" ry="4" fill="#18092e"/>

    <!-- Tuerca Hexagonal M3 -->
    <polygon points="145,90 155,75 175,75 185,90 175,105 155,105" fill="url(#steelGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="165" cy="90" r="8" fill="#18092e" stroke="#64748b" stroke-width="1.2"/>
    <text x="165" y="124" font-family="'IBM Plex Mono', monospace" font-size="7.5" fill="#cfc0ab" font-weight="700" text-anchor="middle">TUERCA M3</text>
  </g>

  <!-- Rótulo General -->
  <text x="120" y="158" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#2dd4bf" font-weight="700" text-anchor="middle" letter-spacing="1">TORNILLERÍA MÉTRICA Y SEPARADORES</text>
</svg>