<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="mbitBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a114f"/>
      <stop offset="50%" stop-color="#18092e"/>
      <stop offset="100%" stop-color="#0f041d"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="mbitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tarjeta BBC Micro:bit -->
  <g filter="url(#mbitGlow)">
    <rect x="36" y="22" width="168" height="136" rx="18" fill="url(#mbitBody)" stroke="#3b1a6c" stroke-width="2.2"/>
    <path d="M 36 38 L 56 22 L 72 22 L 52 38 Z" fill="#eab308" opacity="0.85"/>
  </g>

  <!-- Botón A (Izquierda) -->
  <rect x="52" y="70" width="18" height="18" rx="4" fill="#110524" stroke="#cfc0ab" stroke-width="1.2"/>
  <circle cx="61" cy="79" r="5" fill="#2dd4bf"/>
  <text x="61" y="100" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2dd4bf" font-weight="700" text-anchor="middle">A</text>

  <!-- Botón B (Derecha) -->
  <rect x="170" y="70" width="18" height="18" rx="4" fill="#110524" stroke="#cfc0ab" stroke-width="1.2"/>
  <circle cx="179" cy="79" r="5" fill="#2dd4bf"/>
  <text x="179" y="100" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#2dd4bf" font-weight="700" text-anchor="middle">B</text>

  <!-- Matriz de 5x5 LEDs Rojos / Iluminados con carita feliz -->
  <!-- Fila 1 -->
  <rect x="94" y="58" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="107" y="58" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="120" y="58" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="133" y="58" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="146" y="58" width="6" height="6" rx="1.5" fill="#3b1a6c"/>
  <!-- Fila 2 -->
  <rect x="94" y="68" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="107" y="68" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="120" y="68" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="133" y="68" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="146" y="68" width="6" height="6" rx="1.5" fill="#3b1a6c"/>
  <!-- Fila 3 -->
  <rect x="94" y="78" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="107" y="78" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="120" y="78" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="133" y="78" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="146" y="78" width="6" height="6" rx="1.5" fill="#3b1a6c"/>
  <!-- Fila 4 -->
  <rect x="94" y="88" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="107" y="88" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="120" y="88" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="133" y="88" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="146" y="88" width="6" height="6" rx="1.5" fill="#ef4444"/>
  <!-- Fila 5 -->
  <rect x="94" y="98" width="6" height="6" rx="1.5" fill="#3b1a6c"/><rect x="107" y="98" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="120" y="98" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="133" y="98" width="6" height="6" rx="1.5" fill="#ef4444"/><rect x="146" y="98" width="6" height="6" rx="1.5" fill="#3b1a6c"/>

  <!-- Logo micro:bit arriba -->
  <ellipse cx="120" cy="38" rx="8" ry="5" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>
  <ellipse cx="128" cy="38" rx="8" ry="5" fill="none" stroke="#2dd4bf" stroke-width="1.8"/>

  <!-- Conector de Borde Dorado (Edge Connector) -->
  <rect x="42" y="132" width="156" height="26" fill="#110524" stroke="#271147" stroke-width="1"/>
  <!-- Anillos grandes (0, 1, 2, 3V, GND) -->
  <circle cx="56" cy="144" r="6" fill="#18092e" stroke="url(#goldEdge)" stroke-width="3"/>
  <text x="56" y="157" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#e7dccb" text-anchor="middle">0</text>

  <circle cx="86" cy="144" r="6" fill="#18092e" stroke="url(#goldEdge)" stroke-width="3"/>
  <text x="86" y="157" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#e7dccb" text-anchor="middle">1</text>

  <circle cx="120" cy="144" r="6" fill="#18092e" stroke="url(#goldEdge)" stroke-width="3"/>
  <text x="120" y="157" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#e7dccb" text-anchor="middle">2</text>

  <circle cx="154" cy="144" r="6" fill="#18092e" stroke="url(#goldEdge)" stroke-width="3"/>
  <text x="154" y="157" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#e7dccb" text-anchor="middle">3V</text>

  <circle cx="184" cy="144" r="6" fill="#18092e" stroke="url(#goldEdge)" stroke-width="3"/>
  <text x="184" y="157" font-family="'IBM Plex Mono', monospace" font-size="6" fill="#e7dccb" text-anchor="middle">GND</text>

  <!-- Pistas finas intermedias doradas -->
  <line x1="68" y1="134" x2="68" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>
  <line x1="74" y1="134" x2="74" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>
  <line x1="102" y1="134" x2="102" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>
  <line x1="108" y1="134" x2="108" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>
  <line x1="136" y1="134" x2="136" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>
  <line x1="142" y1="134" x2="142" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>
  <line x1="168" y1="134" x2="168" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>
  <line x1="174" y1="134" x2="174" y2="152" stroke="url(#goldEdge)" stroke-width="1.8"/>

  <text x="120" y="174" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#2dd4bf" font-weight="700" text-anchor="middle">BBC MICRO:BIT V2</text>
</svg>