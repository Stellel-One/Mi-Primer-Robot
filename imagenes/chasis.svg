<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="chassisPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1a6c"/>
      <stop offset="50%" stop-color="#271147"/>
      <stop offset="100%" stop-color="#140727"/>
    </linearGradient>
    <filter id="chassisPlateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Chasis Acrílico 2WD Cortado con Láser en Morado Traslúcido Tecnológico -->
  <g filter="url(#chassisPlateShadow)">
    <rect x="35" y="25" width="170" height="130" rx="22" fill="url(#chassisPlateGrad)" stroke="#2dd4bf" stroke-width="2.2"/>
    <!-- Bisel interior con brillo acrílico -->
    <rect x="42" y="32" width="156" height="116" rx="16" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Ranuras para fijación de Motores TT Laterales -->
  <rect x="45" y="55" width="8" height="35" rx="3" fill="#110524" stroke="#2dd4bf" stroke-width="1.2"/>
  <rect x="45" y="98" width="8" height="25" rx="3" fill="#110524" stroke="#2dd4bf" stroke-width="1.2"/>

  <rect x="187" y="55" width="8" height="35" rx="3" fill="#110524" stroke="#2dd4bf" stroke-width="1.2"/>
  <rect x="187" y="98" width="8" height="25" rx="3" fill="#110524" stroke="#2dd4bf" stroke-width="1.2"/>

  <!-- Orificios para Rueda Loca Frontal -->
  <circle cx="120" cy="42" r="6" fill="#110524" stroke="#e7dccb" stroke-width="1.8"/>
  <circle cx="100" cy="42" r="3.5" fill="#110524" stroke="#2dd4bf" stroke-width="1.2"/>
  <circle cx="140" cy="42" r="3.5" fill="#110524" stroke="#2dd4bf" stroke-width="1.2"/>

  <!-- Orificios de Montaje para Portapilas y Sensores TCRT5000 -->
  <circle cx="65" cy="45" r="4" fill="#110524" stroke="#e7dccb" stroke-width="1.5"/>
  <circle cx="175" cy="45" r="4" fill="#110524" stroke="#e7dccb" stroke-width="1.5"/>
  <circle cx="70" cy="135" r="4" fill="#110524" stroke="#e7dccb" stroke-width="1.5"/>
  <circle cx="170" cy="135" r="4" fill="#110524" stroke="#e7dccb" stroke-width="1.5"/>

  <!-- Calado central pasacables -->
  <rect x="95" y="80" width="50" height="20" rx="6" fill="#110524" stroke="#3b1a6c" stroke-width="1.5"/>

  <!-- Grabado Láser de Identificación -->
  <text x="120" y="118" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#2dd4bf" font-weight="700" text-anchor="middle" letter-spacing="1.2">CHASIS ACRI-2WD</text>
  <text x="120" y="132" font-family="'DM Sans', sans-serif" font-size="7.5" fill="#cfc0ab" text-anchor="middle" font-weight="600">CORTE LÁSER 3MM</text>
</svg>