<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="gearboxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="dcMotorMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="whiteShaft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e7dccb"/>
      <stop offset="100%" stop-color="#cfc0ab"/>
    </linearGradient>
    <filter id="motorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Cables de alimentación soldados (Rojo + y Morado/Azul -) -->
  <path d="M 45 68 C 25 65 15 50 10 40" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 45 112 C 25 115 15 130 10 140" stroke="#2dd4bf" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Cilindro Metálico del Motor DC -->
  <g id="dcCan">
    <rect x="36" y="62" width="28" height="56" rx="4" fill="url(#dcMotorMetal)" stroke="#334155" stroke-width="1.5"/>
    <rect x="32" y="70" width="4" height="40" rx="1" fill="#64748b"/>
    <!-- Terminales de soldadura -->
    <rect x="42" y="65" width="6" height="5" fill="#ef4444"/>
    <rect x="42" y="110" width="6" height="5" fill="#2dd4bf"/>
  </g>

  <!-- Caja Reductora Amarilla (Carcasa TT) -->
  <g filter="url(#motorShadow)">
    <rect x="64" y="44" width="115" height="92" rx="12" fill="url(#gearboxGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Relieve de los engranajes internos -->
    <circle cx="118" cy="90" r="24" fill="#92400e" opacity="0.3"/>
    <circle cx="118" cy="90" r="16" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
    <circle cx="86" cy="74" r="12" fill="#92400e" opacity="0.3"/>
  </g>

  <!-- Eje de Salida con Ranura en D (D-Shaft para acople de rueda) -->
  <rect x="179" y="76" width="35" height="28" rx="4" fill="url(#whiteShaft)" stroke="#78350f" stroke-width="1.5"/>
  <rect x="190" y="83" width="18" height="14" rx="2" fill="#18092e"/>

  <!-- Orificios de Montaje con Tornillos -->
  <circle cx="95" cy="56" r="4.5" fill="#18092e" stroke="#fef3c7" stroke-width="1.5"/>
  <circle cx="152" cy="124" r="4.5" fill="#18092e" stroke="#fef3c7" stroke-width="1.5"/>

  <!-- Texto Técnico en la Caja -->
  <text x="120" y="93" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1">TT GEAR 1:48</text>
  <text x="120" y="106" font-family="'DM Sans', sans-serif" font-size="7" fill="#fef3c7" text-anchor="middle" font-weight="600">3V - 6V DC REDUCTOR</text>
</svg>