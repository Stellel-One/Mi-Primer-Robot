<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="switchMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfc0ab"/>
      <stop offset="100%" stop-color="#766485"/>
    </linearGradient>
    <linearGradient id="switchBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1354"/>
      <stop offset="100%" stop-color="#140727"/>
    </linearGradient>
    <linearGradient id="actuatorAqua" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="swShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c0418" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Pestañas metálicas de montaje con orificios para tornillos M2 -->
  <g filter="url(#swShadow)">
    <rect x="42" y="60" width="156" height="52" rx="6" fill="url(#switchMetal)" stroke="#3b1a6c" stroke-width="1.5"/>
    <circle cx="56" cy="86" r="4.5" fill="#18092e" stroke="#766485" stroke-width="1.2"/>
    <circle cx="184" cy="86" r="4.5" fill="#18092e" stroke="#766485" stroke-width="1.2"/>
  </g>

  <!-- Cuerpo Aislante de Baquelita Morado Oscuro -->
  <rect x="74" y="66" width="92" height="40" rx="4" fill="url(#switchBase)" stroke="#110524" stroke-width="1.5"/>

  <!-- Guía de Deslizamiento (Slot) -->
  <rect x="88" y="77" width="64" height="18" rx="3" fill="#0d031c"/>

  <!-- Actuador Deslizante (Palanca) en Posición ON con Brillo Aguamarina -->
  <rect x="122" y="44" width="28" height="45" rx="5" fill="url(#actuatorAqua)" stroke="#110524" stroke-width="1.5"/>
  <line x1="126" y1="56" x2="146" y2="56" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="126" y1="64" x2="146" y2="64" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- Terminales / Patillas de Conexión Inferiores -->
  <rect x="94" y="112" width="8" height="24" rx="2" fill="url(#switchMetal)" stroke="#3b1a6c" stroke-width="1"/>
  <circle cx="98" cy="128" r="2" fill="#18092e"/>

  <rect x="116" y="112" width="8" height="24" rx="2" fill="url(#switchMetal)" stroke="#3b1a6c" stroke-width="1"/>
  <circle cx="120" cy="128" r="2" fill="#18092e"/>

  <rect x="138" y="112" width="8" height="24" rx="2" fill="url(#switchMetal)" stroke="#3b1a6c" stroke-width="1"/>
  <circle cx="142" cy="128" r="2" fill="#18092e"/>

  <!-- Rótulo del estado -->
  <text x="104" y="90" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#cfc0ab" font-weight="700">OFF</text>
  <text x="136" y="90" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#2dd4bf" font-weight="700">ON</text>

  <text x="120" y="156" font-family="'DM Sans', sans-serif" font-size="8.5" fill="#2dd4bf" font-weight="700" text-anchor="middle" letter-spacing="1">INTERRUPTOR CORTE SPST 1A</text>
</svg>