<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Navia - mascota de TecnoSafe</title>
  <style>
    .navia-body { transform-box: fill-box; transform-origin: center; animation: navia-float 3.4s ease-in-out infinite; }
    .navia-antenna { transform-box: fill-box; transform-origin: 50% 100%; animation: navia-signal 2.4s ease-in-out infinite; }
    .navia-eyes { transform-box: fill-box; transform-origin: center; animation: navia-blink 5.8s ease-in-out infinite; }
    @keyframes navia-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes navia-signal { 0%, 72%, 100% { transform: rotate(0); } 80%, 88% { transform: rotate(-9deg); } }
    @keyframes navia-blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) {
      .navia-body, .navia-antenna, .navia-eyes { animation: none; }
    }
  </style>
  <g class="navia-body">
    <path d="M64 28v-9" fill="none" stroke="#17352f" stroke-width="4" stroke-linecap="round"/>
    <g class="navia-antenna">
      <path d="M64 24v-5" fill="none" stroke="#17352f" stroke-width="4" stroke-linecap="round"/>
      <circle cx="64" cy="13" r="8" fill="#ef9b65" stroke="#17352f" stroke-width="3"/>
      <path d="m61 13 2 2 4-5" fill="none" stroke="#17352f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M27 58h-5a8 8 0 0 0 0 16h6m78-16h5a8 8 0 0 1 0 16h-6" fill="#d5ed69" stroke="#17352f" stroke-width="4" stroke-linecap="round"/>
    <path d="M29 53c0-15 12-27 27-27h16c15 0 27 12 27 27v37c0 15-12 27-27 27H56c-15 0-27-12-27-27z" fill="#26745c" stroke="#17352f" stroke-width="4"/>
    <rect x="38" y="40" width="52" height="50" rx="19" fill="#f5f8f4" stroke="#17352f" stroke-width="3"/>
    <g class="navia-eyes" fill="#17352f">
      <ellipse cx="53" cy="62" rx="4" ry="5.5"/>
      <ellipse cx="75" cy="62" rx="4" ry="5.5"/>
    </g>
    <path d="M54 76q10 9 20 0" fill="none" stroke="#26745c" stroke-width="3" stroke-linecap="round"/>
    <path d="M49 95h30l-3 16H52z" fill="#d5ed69" stroke="#17352f" stroke-width="3" stroke-linejoin="round"/>
    <path d="m58 102 5 5 8-9" fill="none" stroke="#17352f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
