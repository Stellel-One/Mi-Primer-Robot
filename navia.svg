<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Navia - mascota de TecnoSafe</title>
  <defs>
    <linearGradient id="naviaHead" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2f8468"/>
      <stop offset="1" stop-color="#1f6350"/>
    </linearGradient>
    <linearGradient id="naviaPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf3ec"/>
    </linearGradient>
  </defs>
  <style>
    .navia-mark { transform-box: view-box; transform-origin: 32px 42px; animation: navia-bob 4.4s ease-in-out infinite; }
    .navia-antenna { transform-box: fill-box; transform-origin: 50% 100%; animation: navia-signal 3.2s ease-in-out infinite; }
    .navia-bulb { transform-box: fill-box; transform-origin: center; animation: navia-bulb 3.2s ease-in-out infinite; }
    .navia-ping { transform-box: fill-box; transform-origin: center; animation: navia-ping 3.2s ease-out infinite; }
    .navia-eyes { transform-box: fill-box; transform-origin: center; animation: navia-blink 5.6s ease-in-out infinite; }
    .navia-ear--l { transform-box: fill-box; transform-origin: 100% 50%; animation: navia-ear-l 4.6s ease-in-out infinite; }
    .navia-ear--r { transform-box: fill-box; transform-origin: 0% 50%; animation: navia-ear-r 4.6s ease-in-out infinite; }
    @keyframes navia-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.02); }
    }
    @keyframes navia-signal {
      0%, 66%, 100% { transform: rotate(0); }
      76% { transform: rotate(-9deg); }
      86% { transform: rotate(5deg); }
      94% { transform: rotate(0); }
    }
    @keyframes navia-bulb {
      0%, 66%, 100% { transform: scale(1); }
      78% { transform: scale(1.12); }
    }
    @keyframes navia-ping {
      0%, 62% { transform: scale(.9); opacity: 0; }
      68% { opacity: .72; }
      94%, 100% { transform: scale(1.42); opacity: 0; }
    }
    @keyframes navia-blink {
      0%, 42%, 46%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(.1); }
    }
    @keyframes navia-ear-l {
      0%, 68%, 100% { transform: rotate(0); }
      76% { transform: rotate(-5deg); }
      86% { transform: rotate(2deg); }
    }
    @keyframes navia-ear-r {
      0%, 68%, 100% { transform: rotate(0); }
      76% { transform: rotate(5deg); }
      86% { transform: rotate(-2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .navia-mark, .navia-antenna, .navia-bulb, .navia-ping, .navia-eyes, .navia-ear--l, .navia-ear--r { animation: none; }
    }
  </style>
  <g class="navia-mark">
    <circle class="navia-ping" cx="32" cy="9.5" r="6" fill="none" stroke="#d5ed69" stroke-width="1.8"/>
    <path d="M32 19v-5" fill="none" stroke="#17352f" stroke-width="3.4" stroke-linecap="round"/>
    <g class="navia-antenna">
      <g class="navia-bulb">
        <circle cx="32" cy="9.5" r="6" fill="#ef9b65" stroke="#17352f" stroke-width="2.6"/>
        <path d="m29.4 9.6 1.9 1.9 3.9-4.4" fill="none" stroke="#17352f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="29.7" cy="7.1" rx="1.6" ry="1" fill="#ffffff" opacity="0.55"/>
      </g>
    </g>
    <rect class="navia-ear--l" x="2.5" y="31.5" width="8" height="16" rx="4" fill="#d5ed69" stroke="#17352f" stroke-width="2.6"/>
    <rect class="navia-ear--r" x="53.5" y="31.5" width="8" height="16" rx="4" fill="#d5ed69" stroke="#17352f" stroke-width="2.6"/>
    <rect x="9" y="19" width="46" height="42" rx="15" fill="url(#naviaHead)" stroke="#17352f" stroke-width="3"/>
    <path d="M24 23c2-3 12-3 14 0" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.18"/>
    <rect x="16.5" y="26" width="31" height="29" rx="11" fill="url(#naviaPlate)" stroke="#17352f" stroke-width="2.6"/>
    <g class="navia-eyes" fill="#17352f">
      <ellipse cx="26" cy="39.5" rx="3.2" ry="4.3"/>
      <ellipse cx="38" cy="39.5" rx="3.2" ry="4.3"/>
    </g>
    <path d="M27 47.5q5 4 10 0" fill="none" stroke="#26745c" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
