<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Navia - mascota de TecnoSafe</title>
  <style>
    .navia-mark { transform-box: fill-box; transform-origin: 50% 82%; animation: navia-bob 4.2s ease-in-out infinite; }
    .navia-antenna { transform-box: fill-box; transform-origin: 50% 100%; animation: navia-signal 2.8s ease-in-out infinite; }
    .navia-eyes { transform-box: fill-box; transform-origin: center; animation: navia-blink 5.4s ease-in-out infinite; }
    @keyframes navia-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
    @keyframes navia-signal { 0%, 68%, 100% { transform: rotate(0); } 78%, 88% { transform: rotate(-10deg); } }
    @keyframes navia-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.12); } }
    @media (prefers-reduced-motion: reduce) {
      .navia-mark, .navia-antenna, .navia-eyes { animation: none; }
    }
  </style>
  <g class="navia-mark">
    <path d="M32 19v-5" fill="none" stroke="#17352f" stroke-width="3.4" stroke-linecap="round"/>
    <g class="navia-antenna">
      <circle cx="32" cy="9.5" r="6" fill="#ef9b65" stroke="#17352f" stroke-width="2.6"/>
      <path d="m29.4 9.6 1.9 1.9 3.9-4.4" fill="none" stroke="#17352f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="2.5" y="31" width="8" height="16" rx="4" fill="#d5ed69" stroke="#17352f" stroke-width="2.6"/>
    <rect x="53.5" y="31" width="8" height="16" rx="4" fill="#d5ed69" stroke="#17352f" stroke-width="2.6"/>
    <rect x="9" y="18" width="46" height="43" rx="15" fill="#26745c" stroke="#17352f" stroke-width="3"/>
    <rect x="16.5" y="25" width="31" height="29" rx="11" fill="#f5f8f4" stroke="#17352f" stroke-width="2.6"/>
    <g class="navia-eyes" fill="#17352f">
      <ellipse cx="26" cy="38.5" rx="3.2" ry="4.3"/>
      <ellipse cx="38" cy="38.5" rx="3.2" ry="4.3"/>
    </g>
    <path d="M27 46.5q5 4 10 0" fill="none" stroke="#26745c" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
